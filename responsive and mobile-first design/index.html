<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>My Business</h1> 
        </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Welcome to My Business</h2>
            <p>Your one-stop solution for all your needs. Learn more about our services.</p>
            <img src="https://via.placeholder.com/300" alt="Business Image" class="intro-image">
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: contact@mybusiness.com</p>
            <p>Phone: +123 456 7890</p>
        </section>
    </main>

    <footer>
        <p>Follow us on social media!</p>
        <div class="social-icons">
            <a href="#">Facebook</a> 
            <a href="#">Twitter</a> 
            <a href="#">Instagram</a>
        </div>
    </footer>

</body>
</html>
